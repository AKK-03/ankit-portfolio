<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Job Reminder</title><style>*{box-sizing:border-box}body{font:15px system-ui;margin:0;background:#f3f7fa;color:#17323e}.w{max-width:900px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#087c6d,#155d75);color:white;padding:25px;border-radius:18px}.card{background:white;margin-top:16px;padding:22px;border-radius:16px;box-shadow:0 8px 25px #0001}.g{display:grid;grid-template-columns:1fr 1fr;gap:15px}label,.title{font-weight:650}input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #b9cbd3;border-radius:10px;background:white}select[multiple]{min-height:190px}.full{grid-column:1/-1}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{border:1px solid #b9cbd3;border-radius:99px;padding:8px 12px;font-weight:500}.chip input{width:auto;margin:0 5px 0 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button{padding:12px 18px;border:0;border-radius:10px;background:#087c6d;color:white;font-weight:700;cursor:pointer}.secondary{background:#155d75}button:disabled{opacity:.55}.hint{font-size:13px;color:#58707b}.msg{display:none;margin-top:15px;padding:12px;border-radius:10px;white-space:pre-wrap}.show{display:block}.ok{background:#e6f7ee;color:#12633e}.bad{background:#fdecec;color:#8a2424}.info{background:#eaf3fb;color:#245a7c}@media(max-width:650px){.g{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="w"><div class="hero"><h1>Family Job Reminder</h1><p>Select multiple jobs and locations and save one personal reminder.</p></div><div class="card"><form id="f"><div class="g">
<label>Send by<select id="channel"><option value="email">Email</option><option value="whatsapp">WhatsApp / Mobile</option></select></label><label>Recipient<input id="address" required autocomplete="email" placeholder="name@example.com"></label>
<label>Job roles — select multiple<select id="roles" multiple><option selected>Software Engineer</option><option>Data Analyst</option><option>Data Scientist</option><option>Business Analyst</option><option>Product Manager</option><option>Project Manager</option><option>UI/UX Designer</option><option>Digital Marketing</option><option>Finance / Accounts</option><option>Human Resources</option><option>Customer Support</option><option>Sales</option><option>MIS Executive</option><option>Accountant</option></select><span class="hint">Choose as many roles as needed.</span></label>
<label>Locations — select multiple<select id="locations" multiple><option selected>Delhi NCR</option><option>Delhi</option><option>Gurugram</option><option>Noida</option><option>Bengaluru</option><option>Hyderabad</option><option>Mumbai</option><option>Pune</option><option>Chennai</option><option>Remote</option><option>India</option></select><span class="hint">Each selected role is searched against each selected location.</span></label>
<label class="full">Additional job roles (optional)<input id="extraRoles" placeholder="Power BI Developer, SQL Analyst"><span class="hint">Separate with commas.</span></label><label class="full">Additional locations (optional)<input id="extraLocations" placeholder="Jaipur, Ahmedabad"><span class="hint">Separate with commas.</span></label>
<label>Reminder time<select id="time"><option value="08:00">8:00 AM</option><option value="09:00" selected>9:00 AM</option><option value="13:00">1:00 PM</option><option value="18:00">6:00 PM</option><option value="20:00">8:00 PM</option></select></label><label>Repeat<select id="repeat"><option value="daily">Every day</option><option value="weekdays" selected>Weekdays</option></select></label><label>Jobs from<select id="days"><option value="1">Last 24 hours</option><option value="3">Last 3 days</option><option value="7" selected>Last 7 days</option><option value="14">Last 14 days</option><option value="30">Last 30 days</option></select></label><label>Time zone<input id="timezone" readonly></label>
<div class="full"><div class="title">Work preference — select multiple</div><div class="chips" id="work"><label class="chip"><input type="checkbox" value="office">Office</label><label class="chip"><input type="checkbox" value="hybrid" checked>Hybrid</label><label class="chip"><input type="checkbox" value="remote" checked>Remote</label><label class="chip"><input type="checkbox" value="home">Work from home</label></div></div><div class="full"><div class="title">Shift — select multiple</div><div class="chips" id="shift"><label class="chip"><input type="checkbox" value="morning" checked>Morning</label><label class="chip"><input type="checkbox" value="evening">Evening</label><label class="chip"><input type="checkbox" value="night">Night</label></div></div></div>
<div class="actions"><button id="check" class="secondary" type="button">Check Family Service</button><button id="save" type="submit">Save my reminder</button></div><div id="msg" class="msg" role="status"></div></form></div></div>
<script src="./cms-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const FAMILY_SENDER_URL='https://script.google.com/macros/s/AKfycbzJEJva4X_TY-hjbTWHikP8E-8UpNM-bsdne9kZr6nqCizn49W-vUGjze0l9JQRppzE/exec';
const $=id=>document.getElementById(id),msg=(t,c='info')=>{$('msg').className='msg show '+c;$('msg').textContent=t},ck=id=>[...$(id).querySelectorAll('input:checked')].map(x=>x.value),sel=id=>[...$(id).selectedOptions].map(x=>x.value),extra=id=>$(id).value.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean),unique=a=>[...new Set(a.map(x=>x.trim()).filter(Boolean))];
function db(){if(!window.PORTFOLIO_CMS?.url||!window.PORTFOLIO_CMS?.anonKey)throw Error('Supabase config was not found. Check cms-config.js.');if(!window.supabase)throw Error('Supabase library did not load.');return window.supabase.createClient(window.PORTFOLIO_CMS.url,window.PORTFOLIO_CMS.anonKey)}
function settings(){let roles=unique([...sel('roles'),...extra('extraRoles')]),locations=unique([...sel('locations'),...extra('extraLocations')]);if(!roles.length)throw Error('Select at least one job role.');if(!locations.length)throw Error('Select at least one location.');return{channel:$('channel').value,address:$('address').value.trim(),mode:'specific',roles,locations,times:[$('time').value],repeat:$('repeat').value,repeatDays:[],timezone:$('timezone').value||'Asia/Kolkata',days:+$('days').value,workModes:ck('work'),shifts:ck('shift')}}
$('timezone').value=Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Kolkata';$('channel').onchange=()=>{$('address').type=$('channel').value==='email'?'email':'tel';$('address').placeholder=$('channel').value==='email'?'name@example.com':'+91 98765 43210'};
$('check').onclick=async()=>{let b=$('check');b.disabled=true;msg('Checking Family sender…');try{let r=await fetch(FAMILY_SENDER_URL+'?action=family_status&ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Sender HTTP '+r.status);let x=await r.json(),lines=[(x.supabaseConnected?'✓':'✕')+' Supabase connection',(x.adzunaConfigured?'✓':'✕')+' Jobs / Adzuna connection',(x.triggerActive?'✓':'✕')+' Automatic Family scheduler','Enabled Family reminders: '+(x.enabledReminders==null?'unknown':x.enabledReminders)];if(x.error)lines.push('Error: '+x.error);msg(lines.join('\n'),x.ok?'ok':'bad')}catch(e){msg('✕ Could not reach the Family sender.\n'+e.message+'\nDeploy the updated Apps Script as a new version.','bad')}finally{b.disabled=false}};
$('f').onsubmit=async e=>{e.preventDefault();let b=$('save');try{let s=settings();if(!s.address)throw Error('Enter the recipient.');msg('Connecting and saving…');b.disabled=true;let {data,error}=await db().rpc('create_family_reminder',{p_settings:s});if(error)throw error;msg('✓ Reminder saved successfully.\nReference: '+data+'\nUse “Check Family Service” to confirm automatic delivery is active.','ok')}catch(x){msg('✕ '+x.message,'bad')}finally{b.disabled=false}};
</script></body></html>
