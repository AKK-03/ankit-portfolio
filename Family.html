<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Job Reminder</title><style>body{font:15px Arial;background:#f3f7fa;color:#16303d;padding:24px}main{max-width:760px;margin:auto}.card{background:#fff;padding:22px;border:1px solid #d4e1e7;border-radius:14px}label{display:block;margin:14px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin-top:5px}button{background:#087c6d;color:white;border:0;border-radius:7px;padding:10px 14px}.checks{display:flex;gap:12px;flex-wrap:wrap}.checks label{display:flex;gap:5px}.checks input{width:auto;margin:0}#msg{white-space:pre-wrap}</style></head><body><main><div class="card"><h1>Create a job reminder</h1><form id="f"><label>Delivery<select id="channel"><option value="email">Email</option><option value="whatsapp">Mobile / WhatsApp</option></select></label><label>Recipient<input id="address" required placeholder="you@example.com"></label><label>Job selection<select id="mode"><option value="specific">Specific roles</option><option value="all">All matching jobs</option><option value="random">Random matching jobs</option></select></label><label id="rl">Job roles<textarea id="roles" placeholder="Software Engineer&#10;Data Analyst"></textarea></label><label>Locations<textarea id="locations" placeholder="Delhi&#10;Gurugram"></textarea></label><label>Reminder times<textarea id="times">09:00</textarea></label><label>Timezone<select id="tz"><option>Asia/Kolkata</option><option>UTC</option><option>America/New_York</option><option>Europe/London</option><option>Asia/Dubai</option><option>Asia/Singapore</option></select></label><label>Repeat<select id="repeat"><option value="daily">Daily</option><option value="weekdays">Weekdays</option><option value="custom">Custom</option></select></label><div id="custom" class="checks" hidden><label><input type="checkbox" value="0">Sun</label><label><input type="checkbox" value="1">Mon</label><label><input type="checkbox" value="2">Tue</label><label><input type="checkbox" value="3">Wed</label><label><input type="checkbox" value="4">Thu</label><label><input type="checkbox" value="5">Fri</label><label><input type="checkbox" value="6">Sat</label></div><label>Jobs posted within (days)<input id="days" type="number" min="1" max="3650" value="7"></label><p>Work mode</p><div id="wm" class="checks"><label><input type="checkbox" value="office">Office</label><label><input type="checkbox" value="home">Home</label><label><input type="checkbox" value="hybrid">Hybrid</label><label><input type="checkbox" value="remote">Remote</label></div><p>Shift</p><div id="sh" class="checks"><label><input type="checkbox" value="morning">Morning</label><label><input type="checkbox" value="evening">Evening</label><label><input type="checkbox" value="night">Night</label></div><br><button id="save">Create reminder</button></form><p id="msg"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='YOUR_SUPABASE_URL',KEY='YOUR_SUPABASE_ANON_KEY',db=supabase.createClient(URL,KEY),$=x=>document.getElementById(x),vals=x=>[...new Set($(x).value.split(/[\n,;]+/).map(v=>v.trim()).filter(Boolean))],cks=x=>[...$(x).querySelectorAll('input:checked')].map(v=>v.value);
$('mode').onchange=()=>$('rl').hidden=$('mode').value!=='specific';$('repeat').onchange=()=>$('custom').hidden=$('repeat').value!=='custom';
$('f').onsubmit=async e=>{e.preventDefault();let s={channel:$('channel').value,address:$('address').value.trim(),mode:$('mode').value,roles:vals('roles'),locations:vals('locations'),times:vals('times'),repeat:$('repeat').value,repeatDays:cks('custom'),timezone:$('tz').value,days:Number($('days').value),workModes:cks('wm'),shifts:cks('sh')};$('save').disabled=true;$('msg').textContent='Saving…';let {data,error}=await db.rpc('create_family_reminder',{p_settings:s});$('save').disabled=false;$('msg').textContent=error?'Could not save: '+error.message:'Reminder registered.\nReference: '+data};
</script></body></html>
