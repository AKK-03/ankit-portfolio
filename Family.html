<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Job Reminder</title><style>*{box-sizing:border-box}body{font:15px system-ui;margin:0;background:#f3f7fa;color:#17323e}.w{max-width:850px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#087c6d,#155d75);color:white;padding:25px;border-radius:18px}.card{background:white;margin-top:16px;padding:22px;border-radius:16px;box-shadow:0 8px 25px #0001}.g{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{font-weight:650}input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #b9cbd3;border-radius:10px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #b9cbd3;border-radius:99px;padding:8px 12px}.chip input{width:auto;margin:0}.full{grid-column:1/-1}button{padding:12px 18px;border:0;border-radius:10px;background:#087c6d;color:white;font-weight:700}.msg{display:none;margin-top:15px;padding:12px;border-radius:10px}.show{display:block}.ok{background:#e6f7ee;color:#12633e}.bad{background:#fdecec;color:#8a2424}.info{background:#eaf3fb;color:#245a7c}@media(max-width:600px){.g{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="w"><div class="hero"><h1>Family Job Reminder</h1><p>Choose your preferences and save them in a few clicks.</p></div><div class="card"><form id="f"><div class="g"><label>Send by<select id="channel"><option value="email">Email</option><option value="whatsapp">WhatsApp / Mobile</option></select></label><label>Recipient<input id="address" required autocomplete="email" placeholder="name@example.com"></label><label>Job role<select id="role"><option>Software Engineer</option><option>Data Analyst</option><option>Data Scientist</option><option>Business Analyst</option><option>Product Manager</option><option>Project Manager</option><option>UI/UX Designer</option><option>Digital Marketing</option><option>Finance / Accounts</option><option>Human Resources</option><option>Customer Support</option><option>Sales</option><option>Other</option></select></label><label id="other" hidden>Other role<input id="otherRole"></label><label>Location<select id="location"><option>Delhi NCR</option><option>Delhi</option><option>Gurugram</option><option>Noida</option><option>Bengaluru</option><option>Hyderabad</option><option>Mumbai</option><option>Pune</option><option>Chennai</option><option>Remote</option></select></label><label>Reminder time<select id="time"><option value="08:00">8:00 AM</option><option value="09:00" selected>9:00 AM</option><option value="13:00">1:00 PM</option><option value="18:00">6:00 PM</option><option value="20:00">8:00 PM</option></select></label><label>Repeat<select id="repeat"><option value="daily">Every day</option><option value="weekdays" selected>Weekdays</option></select></label><label>Jobs from<select id="days"><option value="1">Last 24 hours</option><option value="3">Last 3 days</option><option value="7" selected>Last 7 days</option><option value="14">Last 14 days</option><option value="30">Last 30 days</option></select></label><div class="full"><b>Work preference</b><div class="chips" id="work"><label class="chip"><input type="checkbox" value="office"> Office</label><label class="chip"><input type="checkbox" value="hybrid" checked> Hybrid</label><label class="chip"><input type="checkbox" value="remote" checked> Remote</label><label class="chip"><input type="checkbox" value="home"> Work from home</label></div></div><div class="full"><b>Shift</b><div class="chips" id="shift"><label class="chip"><input type="checkbox" value="morning" checked> Morning</label><label class="chip"><input type="checkbox" value="evening"> Evening</label><label class="chip"><input type="checkbox" value="night"> Night</label></div></div></div><p><button id="save">Save my reminder</button></p><div id="msg" class="msg"></div></form></div></div>
<script src="./cms-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=x=>document.getElementById(x);function msg(t,c='info'){$('msg').className='msg show '+c;$('msg').textContent=t}function ck(id){return [...$(id).querySelectorAll('input:checked')].map(x=>x.value)}function db(){if(!window.PORTFOLIO_CMS?.url||!window.PORTFOLIO_CMS?.anonKey)throw Error('Portfolio Supabase config was not found. Check config.js path.');if(!window.supabase)throw Error('Supabase library did not load.');return window.supabase.createClient(window.PORTFOLIO_CMS.url,window.PORTFOLIO_CMS.anonKey)}$('role').onchange=()=>$('other').hidden=$('role').value!=='Other';$('channel').onchange=()=>{$('address').type=$('channel').value==='email'?'email':'tel';$('address').placeholder=$('channel').value==='email'?'name@example.com':'+91 98765 43210'};$('f').onsubmit=async e=>{e.preventDefault();let b=$('save');try{msg('Connecting and saving…');let role=$('role').value==='Other'?$('otherRole').value.trim():$('role').value;if(!role)throw Error('Enter a job role.');b.disabled=true;let s={channel:$('channel').value,address:$('address').value.trim(),mode:'specific',roles:[role],locations:[$('location').value],times:[$('time').value],repeat:$('repeat').value,repeatDays:[],timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Kolkata',days:+$('days').value,workModes:ck('work'),shifts:ck('shift')};let {data,error}=await db().rpc('create_family_reminder',{p_settings:s});if(error)throw error;msg('✓ Reminder saved successfully. Reference: '+data,'ok')}catch(x){msg('✕ '+x.message,'bad')}finally{b.disabled=false}};
</script></body></html>
