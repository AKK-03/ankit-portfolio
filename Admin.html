<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:15px/1.5 Arial,sans-serif;background:#f3f7fa;color:#16303d;margin:0;padding:24px}main{max-width:780px;margin:auto}.card{background:white;border:1px solid #d4e1e7;border-radius:14px;padding:22px;margin-bottom:16px}h1{font-size:26px}h2{font-size:18px}label{display:block;margin:12px 0;font-size:13px;font-weight:600}input,textarea,select{display:block;width:100%;box-sizing:border-box;padding:9px;margin-top:5px;border:1px solid #b8cbd8;border-radius:7px;background:#f8fafc;font:14px Arial}button{background:#087c6d;color:white;padding:7px 11px;border:0;border-radius:6px;cursor:pointer;font-size:13px}button:disabled{opacity:.5;cursor:wait}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.hint{font-size:13px;color:#526879}.checks{display:flex;flex-wrap:wrap;gap:12px}.checks label{font-weight:400;display:flex;align-items:center;gap:5px}.checks input{width:auto;margin:0}details{margin:12px 0}summary{cursor:pointer;padding:9px;background:#f8fafc;border:1px solid #b8cbd8;border-radius:7px}#message{white-space:pre-wrap}button:focus-visible,input:focus,textarea:focus,select:focus,summary:focus-visible{outline:2px solid #087c6d;outline-offset:2px}[hidden]{display:none!important}@media(max-width:600px){.row{grid-template-columns:1fr}body{padding:12px}}</style><body><main><div class="card"><h1>Family reminder administration</h1><p class="hint">Administrator authentication is required for every request. The token remains in memory only.</p><label>Administrator token<input id="token" type="password" autocomplete="off"></label><button id="load">Load reminders</button> <button id="lock">Lock</button><p id="message" role="status"></p></div><div id="records"></div><script>
const $=id=>document.getElementById(id);let token='';function error(e){$('message').textContent=e.message||'Request failed.'}
function load(){token=$('token').value;$('message').textContent='Loading…';if(typeof google==='undefined'){error({message:'Open the deployed admin URL.'});return}google.script.run.withSuccessHandler(rows=>{$('records').replaceChildren();$('message').textContent=rows.length+' reminders';rows.forEach(row=>{const card=document.createElement('div');card.className='card';const heading=document.createElement('h2');heading.textContent=row.settings.address;card.appendChild(heading);const p=document.createElement('p');p.textContent=(row.enabled?'Enabled':'Disabled')+' · '+row.settings.channel+' · '+row.settings.times.join(', ')+' · '+row.settings.timezone;card.appendChild(p);const details=document.createElement('details'),summary=document.createElement('summary');summary.textContent='Full preferences';details.appendChild(summary);Object.entries(row.settings).forEach(([key,value])=>{const line=document.createElement('p');line.textContent=key+': '+(Array.isArray(value)?value.join(', '):value);details.appendChild(line)});card.appendChild(details);const toggle=document.createElement('button');toggle.textContent=row.enabled?'Disable':'Enable';toggle.onclick=()=>google.script.run.withSuccessHandler(load).withFailureHandler(error).adminSetFamilyReminderEnabled(token,row.id,!row.enabled);card.appendChild(toggle);const del=document.createElement('button');del.style.marginLeft='8px';del.textContent='Delete';del.onclick=()=>{if(confirm('Delete reminder for '+row.settings.address+'?'))google.script.run.withSuccessHandler(load).withFailureHandler(error).adminDeleteFamilyReminder(token,row.id)};card.appendChild(del);$('records').appendChild(card)})}).withFailureHandler(e=>{$('records').replaceChildren();error(e)}).adminListFamilyReminders(token)};$('load').onclick=load;$('lock').onclick=()=>{token='';$('token').value='';$('records').replaceChildren();$('message').textContent='Locked.'};
</script></main></body></html>
