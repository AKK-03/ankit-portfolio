<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Admin</title><style>*{box-sizing:border-box}body{font:15px system-ui;margin:0;background:#f3f7fa;color:#17323e}.w{max-width:850px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#087c6d,#155d75);color:#fff;padding:25px;border-radius:18px}.card{background:#fff;margin-top:16px;padding:22px;border-radius:16px;box-shadow:0 8px 25px #0001}input{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #b9cbd3;border-radius:10px}button{padding:10px 15px;border:0;border-radius:10px;background:#087c6d;color:#fff;font-weight:700;margin-right:7px}.danger{background:#9b3030}.secondary{background:#526b76}.msg{margin-top:12px;padding:12px;border-radius:10px;background:#eaf3fb}.bad{background:#fdecec;color:#8a2424}.ok{background:#e6f7ee;color:#12633e}</style></head><body><div class="w"><div class="hero"><h1>Family Reminder Admin</h1><p>Sign in and manage saved reminders.</p></div><div class="card" id="login"><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="signin">Sign in</button><div id="loginMsg" class="msg">Use an account from Supabase Authentication → Users.</div></div><div class="card" id="tools" hidden><b id="who"></b><p><button id="refresh">Refresh</button><button id="signout" class="secondary">Sign out</button></p><div id="adminMsg" class="msg"></div></div><div id="records"></div></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=x=>document.getElementById(x);let client;function m(id,t,b=false){$(id).className='msg '+(b?'bad':'ok');$(id).textContent=t}function db(){if(client)return client;if(!window.PORTFOLIO_CMS?.url||!window.PORTFOLIO_CMS?.anonKey)throw Error('Portfolio Supabase config was not found. Check config.js path.');if(!window.supabase)throw Error('Supabase library did not load.');return client=window.supabase.createClient(window.PORTFOLIO_CMS.url,window.PORTFOLIO_CMS.anonKey)}async function load(){m('adminMsg','Loading reminders…');$('records').replaceChildren();let {data,error}=await db().from('family_reminders').select('*').order('created_at',{ascending:false});if(error){m('adminMsg','✕ '+error.message,true);return}m('adminMsg','✓ '+data.length+' reminder(s) loaded.');data.forEach(r=>{let d=document.createElement('div');d.className='card';let h=document.createElement('h2');h.textContent=r.settings.address||'Reminder';let p=document.createElement('p');p.textContent=(r.enabled?'Enabled':'Disabled')+' • '+(r.settings.roles||[]).join(', ')+' • '+(r.settings.locations||[]).join(', ')+' • '+(r.settings.times||[]).join(', ');let t=document.createElement('button');t.textContent=r.enabled?'Disable':'Enable';t.onclick=async()=>{let {error}=await db().from('family_reminders').update({enabled:!r.enabled}).eq('id',r.id);error?m('adminMsg','✕ '+error.message,true):load()};let x=document.createElement('button');x.className='danger';x.textContent='Delete';x.onclick=async()=>{if(confirm('Delete this reminder?')){let {error}=await db().from('family_reminders').delete().eq('id',r.id);error?m('adminMsg','✕ '+error.message,true):load()}};d.append(h,p,t,x);$('records').append(d)})}async function state(){try{let {data:{session}}=await db().auth.getSession();$('login').hidden=!!session;$('tools').hidden=!session;if(session){$('who').textContent='Signed in: '+session.user.email;await load()}else $('records').replaceChildren()}catch(e){m('loginMsg','✕ '+e.message,true)}}$('signin').onclick=async()=>{let b=$('signin');try{if(!$('email').value||!$('password').value)throw Error('Enter email and password.');b.disabled=true;m('loginMsg','Signing in…');let {error}=await db().auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;m('loginMsg','✓ Sign-in successful.');await state()}catch(e){m('loginMsg','✕ '+e.message,true)}finally{b.disabled=false}};$('refresh').onclick=load;$('signout').onclick=async()=>{await db().auth.signOut();state()};state();
</script></body></html>
