<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Admin</title><style>body{font:15px Arial;background:#f3f7fa;color:#16303d;padding:24px}main{max-width:820px;margin:auto}.card{background:#fff;padding:22px;border:1px solid #d4e1e7;border-radius:14px;margin-bottom:15px}input{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 12px}button{background:#087c6d;color:#fff;border:0;border-radius:7px;padding:9px 12px;margin-right:7px}.danger{background:#8b1e1e}pre{white-space:pre-wrap}</style></head><body><main><div class="card"><h1>Family reminder administration</h1><div id="login"><label>Email<input id="email" type="email"></label><label>Password<input id="pass" type="password"></label><button id="in">Sign in</button></div><div id="tools" hidden><button id="refresh">Refresh</button><button id="out">Sign out</button></div><p id="msg"></p></div><div id="records"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='YOUR_SUPABASE_URL',KEY='YOUR_SUPABASE_ANON_KEY',db=supabase.createClient(URL,KEY),$=x=>document.getElementById(x);
async function load(){let {data,error}=await db.from('family_reminders').select('*').order('created_at',{ascending:false});$('records').replaceChildren();if(error){$('msg').textContent=error.message;return}$('msg').textContent=data.length+' reminder(s)';for(const r of data){let d=document.createElement('div');d.className='card';let h=document.createElement('h2');h.textContent=r.settings.address;let p=document.createElement('p');p.textContent=(r.enabled?'Enabled':'Disabled')+' · '+r.settings.channel+' · '+(r.settings.times||[]).join(', ');let pre=document.createElement('pre');pre.textContent=JSON.stringify(r.settings,null,2);let t=document.createElement('button');t.textContent=r.enabled?'Disable':'Enable';t.onclick=async()=>{let {error}=await db.from('family_reminders').update({enabled:!r.enabled}).eq('id',r.id);error?alert(error.message):load()};let del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=async()=>{if(confirm('Delete this reminder?')){let {error}=await db.from('family_reminders').delete().eq('id',r.id);error?alert(error.message):load()}};d.append(h,p,pre,t,del);$('records').append(d)}}
async function state(){let {data:{session}}=await db.auth.getSession();$('login').hidden=!!session;$('tools').hidden=!session;if(session)load();else{$('records').replaceChildren();$('msg').textContent='Sign in to manage reminders.'}}
$('in').onclick=async()=>{let {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(error)$('msg').textContent=error.message;else state()};$('out').onclick=async()=>{await db.auth.signOut();state()};$('refresh').onclick=load;state();
</script></body></html>
