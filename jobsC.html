<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Job radar</title>
<style>
:root{--bg:#09131d;--card:#102130;--ink:#e8eff4;--muted:#9db0bf;--line:#223646;--mint:#65e2ce;--amber:#f2a541}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'IBM Plex Sans',Arial,sans-serif;padding:24px 20px 80px}
main{max-width:880px;margin:auto}h1{font-size:34px;margin:0 0 4px;letter-spacing:-1px}h2{font-size:18px;margin:0 0 12px}p.s{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
input,textarea,select{width:100%;margin-top:5px;padding:10px 12px;background:#0b1824;border:1px solid #3c5a6a;border-radius:8px;color:#fff;font:15px 'IBM Plex Sans',Arial,sans-serif}
input[type=checkbox]{width:auto;margin:0;padding:0}
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--mint)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.r3{grid-template-columns:repeat(3,1fr)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.sw:last-child{border:0}.sw small{display:block;color:var(--muted);font-size:13px}
.tg{position:relative;width:52px;height:30px;flex:none}.tg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.tg i{position:absolute;inset:0;background:#2a4152;border-radius:30px;transition:.2s}.tg i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tg input:checked+i{background:var(--mint)}.tg input:checked+i::after{transform:translateX(22px)}.tg input:focus-visible+i{outline:2px solid var(--mint);outline-offset:3px}
button,.p a{padding:10px 16px;border-radius:8px;border:1px solid var(--mint);background:transparent;color:var(--mint);font:600 14px 'IBM Plex Sans',Arial,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
button.m{background:var(--mint);color:#06231f}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.p{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:6px}.p a{text-align:center}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.ch label{display:flex;align-items:center;gap:8px;margin:0;padding:6px 12px;border:1px solid #3c5a6a;border-radius:18px;color:var(--ink);font-weight:500}
.ch button{padding:0 6px;border:0;font-size:16px;color:var(--amber)}
#msg{position:fixed;top:16px;left:50%;transform:translateX(-50%);max-width:92vw;background:var(--amber);color:#2a1a00;font-weight:600;font-size:14px;padding:10px 18px;border-radius:24px;z-index:9;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#lock{max-width:340px;margin:18vh auto}.hint{color:var(--muted);font-size:13px;margin:10px 0 0}
@media(max-width:620px){.row,.r3{grid-template-columns:1fr}}
</style></head><body>
<div id="msg" role="status"></div>
<div id="lock" class="card"><h2 id="lt">Enter PIN</h2><input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN"><div class="btns"><button class="m" id="go">Unlock</button></div><p id="msg0" class="hint" style="color:var(--amber)"></p></div>
<main id="app" hidden>
<h1>Job radar</h1><p class="s">Everything below is yours to set. Nothing is preset.</p>
<div class="card"><h2>Switches</h2>
<div class="sw"><div>Daily reminders (email + WhatsApp)<small id="st">Not connected</small></div><span class="tg"><input type="checkbox" id="on" aria-label="Daily reminders"><i></i></span></div>
<div class="sw"><div>Hidden shortcut on portfolio<small id="scs">Tap the logo 5 times on this device</small></div><span class="tg"><input type="checkbox" id="sc" aria-label="Portfolio shortcut"><i></i></span></div></div>
<div class="card"><h2>What to look for</h2>
<div class="row"><label>Job keywords (one per line)<textarea id="kw" rows="3" placeholder="e.g. your job title or skill"></textarea></label><label>Locations (one per line)<textarea id="loc" rows="3" placeholder="e.g. city, state or Remote"></textarea></label></div>
<label>Job type</label><div class="ch" id="types"></div>
<div class="row r3"><label>Experience (years)<input id="exp" type="number" min="0" placeholder="any"></label><label>Posted within<select id="days"><option value="1">24 hours</option><option value="3">3 days</option><option value="7">7 days</option><option value="30">30 days</option></select></label><label>Work mode<select id="remote"><option value="">Any</option><option value="1">Remote only</option></select></label></div></div>
<div class="card"><h2>Reminder settings</h2>
<div class="row r3"><label>Send email to<input id="email" type="email" placeholder="you@example.com"></label><label>WhatsApp number<input id="wa" placeholder="+91…"></label><label>Send daily at<select id="hour"></select></label></div>
<div class="btns"><button class="m" id="save">Save &amp; sync</button><button id="reset">Clear all</button></div></div>
<div class="card"><h2>Search now</h2><div class="row"><label>Keyword<select id="pk"></select></label><label>Location<select id="pl"></select></label></div>
<div class="p" id="ports"></div><p class="hint" id="ph"></p>
<h2 style="margin-top:20px;font-size:15px">Portals</h2><div class="ch" id="ptog"></div>
<div class="row"><label>Add a portal: name<input id="cn" placeholder="Portal name"></label><label>Search link with {keyword} {location}<input id="cu" placeholder="https://site.com/jobs?q={keyword}&l={location}"></label></div>
<div class="btns"><button id="cadd">Add portal</button></div></div>
<div class="card"><h2>Reminder connection</h2><label>Apps Script web app URL<input id="url" placeholder="https://script.google.com/macros/s/…/exec"></label><label>Secret token<input id="tok" type="password"></label>
<div class="btns"><button id="conn" class="m">Connect &amp; load settings</button><button id="test">Send test now</button><button id="lk">Change PIN</button></div></div>
</main>
<script>
var $=function(i){return document.getElementById(i)},L=localStorage,enc=encodeURIComponent,tt;
var D={kw:[],loc:[],types:[],exp:'',days:'1',remote:'',hour:'9',email:'',wa:'',off:[],custom:[]},st=Object.assign({},D);
try{Object.assign(st,JSON.parse(L.getItem('jr_state')||'{}'))}catch(e){}
function persist(){L.setItem('jr_state',JSON.stringify(st))}
function say(t){var m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(tt);tt=setTimeout(function(){m.style.display='none'},4500)}
async function h(s){try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('jr'+s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}catch(e){var n=5381;for(var i=0;i<s.length;i++)n=(n*33^s.charCodeAt(i))>>>0;return 'x'+n}}
var stored=L.getItem('jr_pin');$('lt').textContent=stored?'Enter PIN':'Create a PIN';$('go').textContent=stored?'Unlock':'Save PIN';
$('go').onclick=async function(){var p=$('pin').value;if(p.length<4){$('msg0').textContent='Use at least 4 digits.';return}var x=await h(p);if(!stored){L.setItem('jr_pin',x);start()}else if(x===stored)start();else $('msg0').textContent='Wrong PIN.'};
$('pin').onkeydown=function(e){if(e.key==='Enter')$('go').click()};
$('lk').onclick=function(){L.removeItem('jr_pin');location.reload()};
function lines(i){return $(i).value.split('\n').map(function(s){return s.trim()}).filter(Boolean)}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
var TY=[['full','Full-time','F','fulltime'],['contract','Contract','C','contract'],['part','Part-time','P','parttime'],['intern','Internship','I','internship']];
function pick(i,arr,sel){$(i).innerHTML='';arr.forEach(function(v){var o=document.createElement('option');o.textContent=v;$(i).appendChild(o)});if(sel&&arr.indexOf(sel)>-1)$(i).value=sel}
function built(k,l){var d=+st.days||1,e=st.exp||0,q=enc(k+(st.remote?' remote':'')),q0=enc(k),c=enc(l),t=TY.filter(function(x){return st.types.indexOf(x[0])>-1}),li=t.map(function(x){return x[2]}).join(','),ind=t.length?t[0][3]:'';
return [['Naukri','https://www.naukri.com/'+slug(k)+'-jobs-in-'+slug(l)+'?experience='+e+'&jobAge='+d],
['LinkedIn','https://www.linkedin.com/jobs/search/?keywords='+q0+'&location='+c+'&f_TPR=r'+d*86400+(li?'&f_JT='+li:'')+(st.remote?'&f_WT=2':'')],
['Indeed','https://in.indeed.com/jobs?q='+q+'&l='+c+'&fromage='+d+(ind?'&jt='+ind:'')],
['Foundit','https://www.foundit.in/srp/results?query='+q+'&locations='+c],
['Shine','https://www.shine.com/job-search/'+slug(k)+'-jobs-in-'+slug(l)],
['Glassdoor','https://www.glassdoor.co.in/Job/jobs.htm?sc.keyword='+q+'&locKeyword='+c],
['Google Jobs','https://www.google.com/search?q='+enc(k+' jobs '+l)+'&ibp=htl;jobs']]}
function ports(){var k=$('pk').value,l=$('pl').value||'India',box=$('ports');box.innerHTML='';$('ph').textContent=k?'':'Add a keyword above to see search links.';if(!k)return;
var all=built(k,l);st.custom.forEach(function(c){all.push([c.n,c.t.replace(/\{keyword\}/g,enc(k)).replace(/\{location\}/g,enc(l)).replace(/\{experience\}/g,st.exp||0).replace(/\{days\}/g,st.days)])});
all.filter(function(p){return st.off.indexOf(p[0])<0}).forEach(function(p){var a=document.createElement('a');a.href=p[1];a.target='_blank';a.rel='noopener noreferrer';a.textContent=p[0];box.appendChild(a)})}
function toggles(){var b=$('ptog');b.innerHTML='';var names=built('x','x').map(function(p){return p[0]}).concat(st.custom.map(function(c){return c.n}));
names.forEach(function(n,i){var lb=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=st.off.indexOf(n)<0;
cb.onchange=function(){st.off=st.off.filter(function(x){return x!==n});if(!cb.checked)st.off.push(n);persist();ports()};lb.appendChild(cb);lb.appendChild(document.createTextNode(n));
if(i>=names.length-st.custom.length){var x=document.createElement('button');x.type='button';x.textContent='×';x.setAttribute('aria-label','Remove '+n);x.onclick=function(e){e.preventDefault();st.custom=st.custom.filter(function(c){return c.n!==n});persist();toggles();ports()};lb.appendChild(x)}b.appendChild(lb)})}
function form(){$('kw').value=st.kw.join('\n');$('loc').value=st.loc.join('\n');$('exp').value=st.exp;$('days').value=st.days;$('remote').value=st.remote;$('email').value=st.email;$('wa').value=st.wa;$('hour').value=st.hour;
$('types').innerHTML='';TY.forEach(function(t){var lb=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.value=t[0];cb.checked=st.types.indexOf(t[0])>-1;lb.appendChild(cb);lb.appendChild(document.createTextNode(t[1]));$('types').appendChild(lb)})}
function read(){st.kw=lines('kw');st.loc=lines('loc');st.exp=$('exp').value;st.days=$('days').value;st.remote=$('remote').value;st.email=$('email').value.trim();st.wa=$('wa').value.trim();st.hour=$('hour').value;
st.types=Array.from($('types').querySelectorAll('input:checked')).map(function(c){return c.value});persist()}
function lists(){pick('pk',st.kw,$('pk').value);pick('pl',st.loc,$('pl').value);ports()}
function conn(){return $('url').value.trim()&&$('tok').value.trim()}
function api(a,x){if(!conn()){say('Connect your reminder script first (Reminder connection card).');$('conn').scrollIntoView({behavior:'smooth',block:'center'});return Promise.reject()}
return fetch($('url').value.trim()+'?action='+a+'&token='+enc($('tok').value.trim())+(x||'')).then(function(r){return r.json()}).then(function(j){if(j.error){say(j.error);throw 0}return j}).catch(function(e){if(e!==0)say('Could not reach the script. Check the URL and that it is deployed for Anyone.');throw e})}
function status(j){$('on').checked=!!j.enabled;$('st').textContent=(j.enabled?'Active — daily at '+j.hour+':00':'Paused')+(j.last?' · last run '+j.last:'')}
function load(j){if(j.kw===undefined)return;st.kw=j.kw?j.kw.split('|'):[];st.loc=j.loc?j.loc.split('|'):[];st.types=j.jt?j.jt.split('|'):[];st.days=j.days||'1';st.hour=j.hour||'9';st.email=j.email||'';st.wa=j.wa||'';st.remote=j.remote||'';persist();form();lists()}
function sync(){read();lists();var x='&kw='+enc(st.kw.join('|'))+'&loc='+enc(st.loc.join('|'))+'&jt='+enc(st.types.join('|'))+'&days='+st.days+'&hour='+st.hour+'&email='+enc(st.email)+'&wa='+enc(st.wa)+'&remote='+st.remote;
if(!conn()){say('Saved on this device. Connect the script to start reminders.');return}api('save',x).then(function(j){status(j);say('Saved and synced to reminders.')}).catch(function(){})}
function start(){$('lock').hidden=true;$('app').hidden=false;
for(var i=0;i<24;i++){var o=document.createElement('option');o.value=i;o.textContent=(i%12||12)+':00 '+(i<12?'AM':'PM');$('hour').appendChild(o)}
$('url').value=L.getItem('jr_url')||'';$('tok').value=L.getItem('jr_tok')||'';form();lists();toggles();
var on=L.getItem('jh_shortcut')!=='off';$('sc').checked=on;$('scs').textContent=on?'On — tap the logo 5 times on this device':'Off on this device';
$('sc').onchange=function(){var v=$('sc').checked;L.setItem('jh_shortcut',v?'on':'off');$('scs').textContent=v?'On — tap the logo 5 times on this device':'Off on this device';say('Shortcut turned '+(v?'on':'off')+'.')};
$('on').onchange=function(){var w=$('on').checked;api(w?'on':'off').then(function(j){status(j);say(w?'Reminders activated.':'Reminders deactivated.')}).catch(function(){$('on').checked=!w})};
['kw','loc','exp','days','remote'].forEach(function(i){$(i).onchange=function(){read();lists();toggles()}});$('types').onchange=function(){read();ports()};
$('pk').onchange=$('pl').onchange=ports;$('save').onclick=sync;
$('reset').onclick=function(){if(confirm('Clear all saved search settings on this device?')){var o=st.custom;st=Object.assign({},D);persist();form();lists();toggles();say('Cleared.')}};
$('cadd').onclick=function(){var n=$('cn').value.trim(),u=$('cu').value.trim();if(!n||!/^https?:\/\//.test(u)||u.indexOf('{keyword}')<0){say('Add a name and a link that starts with https:// and contains {keyword}.');return}st.custom.push({n:n,t:u});persist();$('cn').value=$('cu').value='';toggles();ports();say(n+' added.')};
$('conn').onclick=function(){L.setItem('jr_url',$('url').value.trim());L.setItem('jr_tok',$('tok').value.trim());api('status').then(function(j){status(j);load(j);say('Connected.')}).catch(function(){})};
$('test').onclick=function(){say('Sending test…');api('test').then(function(j){say('Test done: '+j.sent+' openings found.')}).catch(function(){})};
if(conn())api('status').then(status).catch(function(){})}
</script></body></html>
